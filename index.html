<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101210"><title>Manas — Personal Assistant</title><link rel="stylesheet" href="/style.css"></head>
<body><div id="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-icon">✳</div><div><strong>manas</strong><small>PERSONAL AI</small></div><button class="icon-button mobile-close" id="closeNav" aria-label="Close navigation">×</button></div><button class="new-chat" id="newChat"><span>＋</span> New conversation</button><div class="side-label">WORKSPACE</div><nav class="nav"><button class="nav-item active" data-view="chat"><span>◉</span> Assistant</button><button class="nav-item" data-view="inbox"><span>✉</span> Inbox & messages <i id="inboxCount"></i></button><button class="nav-item" data-view="code"><span>⌘</span> Code review</button><button class="nav-item" data-view="tasks"><span>◷</span> Tasks & reminders <i id="taskCount"></i></button></nav><div class="side-label history-label">RECENT</div><div id="history" class="history"></div><div class="sidebar-spacer"></div><div class="privacy-note"><span>◈</span><div><strong>Private by default</strong><small>Your data stays on this device</small></div></div><button class="nav-item settings-link" data-view="settings"><span>⚙</span> Settings <i class="connection-dot" id="settingsDot"></i></button><div class="profile"><div class="avatar">S</div><div><strong>Local workspace</strong><small>Personal assistant</small></div><span class="online"></span></div></aside>
<main class="main"><header class="topbar"><button id="menuToggle" class="icon-button menu-toggle" aria-label="Open navigation">☰</button><div class="crumb">Workspace <span>/</span> <strong id="crumbTitle">Assistant</strong></div><div class="top-right"><div class="status-pill" id="aiStatus"><i></i><span>Checking AI…</span></div><button class="icon-button" id="voiceTop" title="Voice input" aria-label="Voice input">⌁</button><div class="avatar small">S</div></div></header><div class="page" id="page"></div></main></div><div id="toast" class="toast"></div><script src="/app.js"></script></body></html>
