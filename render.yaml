services:
  - type: web
    name: manas-personal-assistant
    runtime: node
    plan: free
    buildCommand: node --check server.mjs && node --check app.js
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PUBLIC_CHAT_ONLY
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: AI_API_FORMAT
        value: openai
      - key: AI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: AI_MODEL
        value: openai/gpt-oss-20b
      - key: AI_MAX_OUTPUT_TOKENS
        value: "384"
      - key: AI_API_KEY
        sync: false
